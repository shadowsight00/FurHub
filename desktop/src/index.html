<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' artmedia: data:; media-src artmedia:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>FurHub</title><link rel="stylesheet" href="style.css"></head>
<body>
<aside id="sidebar"><div class="brand"><img class="brand-logo" src="../assets/icon.png" alt="FurHub fox logo"><div><strong>FurHub</strong><small>One library. Two sources.</small></div></div>
<nav aria-label="Library"><button data-tab="explore" class="active"><span>◈</span>Explore</button><button data-tab="favorites"><span>♡</span>Favorites</button><button data-tab="following"><span>◎</span>Following</button><div class="nav-separator"></div><button data-tab="collections"><span>▦</span>Collections</button><button data-tab="downloads"><span>↓</span>Downloads</button><button data-tab="settings"><span>⚙</span>Settings</button></nav>
<div class="sidebar-bottom"><div class="connected"><i></i><span>Unified library</span></div><small id="version"></small></div></aside>
<main><header><div><p class="eyebrow">YOUR ART, TOGETHER</p><h1 id="title">Explore</h1><p id="subtitle">Discover artwork from e621 and Inkbunny in one place.</p></div><div class="header-actions"><button id="search-toggle" class="quiet">Hide search</button><button id="refresh">↻ Refresh</button></div></header>
<section id="search-panel"><form id="search-form"><div class="search-field"><label for="e-query">e621 <small>TAGS & SYNTAX</small></label><input id="e-query" list="e-suggestions" placeholder="Search tags, artists, or pools…" autocomplete="off"><datalist id="e-suggestions"></datalist></div><div class="search-field"><label for="i-query">Inkbunny <small>KEYWORDS</small></label><input id="i-query" list="i-suggestions" placeholder="Search keywords…" autocomplete="off"><datalist id="i-suggestions"></datalist></div><button class="primary" type="submit">Search library <span>↗</span></button></form><div class="search-footer"><div id="source-toggles"></div><div><button class="text-button" id="history">Recent searches</button><button class="text-button" id="save-search">＋ Save search</button></div></div></section>
<section id="gallery-section"><div class="toolbar"><div><strong id="count">Your unified gallery</strong><span id="gallery-status"></span></div><div class="toolbar-controls"><button id="batch-download" hidden>Download selected</button><button id="clear-selection" hidden>Clear selection</button><label class="size-control">Size <input id="grid-size" type="range" min="140" max="400" value="220" aria-label="Thumbnail size"></label><button id="sort" class="quiet">Newest first ↓</button></div></div><div id="source-status" aria-live="polite"></div><div id="grid" class="grid"></div><div id="empty" hidden><div class="empty-icon">◈</div><h2>No artwork to show</h2><p>Try another search, connect your accounts, or retry a source below.</p></div><button id="load-more" class="load-more">Load more artwork</button></section>
<section id="other-section" hidden></section>
<footer><span>e621 + Inkbunny</span><span>Browse. Collect. Make it yours.</span></footer></main>
<dialog id="viewer"><div class="viewer-top"><button id="viewer-close">← Back to library</button><span id="viewer-position"></span><button id="details-toggle">Details ⓘ</button></div><div class="viewer-layout"><button id="previous-art" class="viewer-arrow" aria-label="Previous artwork">‹</button><div class="viewer-canvas"><div id="media-stage"></div><div class="zoom-controls"><button id="zoom-out">−</button><button id="zoom-reset">Fit</button><button id="zoom-in">＋</button><button id="fullscreen">⛶</button></div></div><button id="next-art" class="viewer-arrow" aria-label="Next artwork">›</button><aside id="art-details"></aside></div><div class="viewer-bottom"><span id="art-title"></span><div id="file-nav"></div><div class="viewer-actions"><button id="favorite">♡ Favorite</button><button id="bookmark">Bookmark</button><button id="add-collection">＋ Collection</button><button id="download-art" class="primary">↓ Download</button></div></div></dialog>
<dialog id="modal"><div class="modal-head"><h2 id="modal-title"></h2><button id="modal-close" aria-label="Close">×</button></div><div id="modal-body"></div></dialog><div id="toast" role="status" hidden></div>
<script src="gallery.js"></script><script src="ui.js"></script></body></html>
